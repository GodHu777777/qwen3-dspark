[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dspark-qwen-lab"
version = "0.1.0"
description = "Readable Qwen3 DSpark training and reference greedy verification"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.6", "transformers>=5.17,<5.18", "safetensors>=0.4"]

[project.optional-dependencies]
data = ["pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["dspark_qwen*"]
